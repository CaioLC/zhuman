<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Action — title</title>
<link rel="stylesheet" href="prototype.css">
<style>
.title-screen { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; width: min(900px, 100vw); height: min(700px, 100vh); overflow: hidden; border: 1px solid var(--line); background: var(--bg); }

/* The attract loop: the real HUD, running, receded far enough to read as ground. */
.attract { color: var(--line-2); pointer-events: none; user-select: none; }
.attract-top { display: flex; gap: 14px; align-items: baseline; justify-content: space-between; padding: 11px 15px; border-bottom: 1px solid var(--line); font-size: 11px; }
.attract-stock { display: flex; gap: 13px; flex-wrap: wrap; min-width: 0; }
.attract-stock span { white-space: nowrap; }
.attract-run { flex: none; letter-spacing: 0.04em; }
.attract-foot { display: grid; gap: 2px; padding: 10px 15px; border-top: 1px solid var(--line); font-size: 11px; }
.attract-line { display: grid; grid-template-columns: 5ch minmax(0, 1fr); gap: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attract-line .t { color: #2b2a25; }
.attract-line:nth-child(1) { color: var(--dim); }
.attract-line:nth-child(2) { color: #4a4841; }

/* A column of work in progress, far right, so the ground has motion as well as text. */
.attract-strip { display: flex; gap: 10px; align-items: baseline; padding: 7px 15px; border-bottom: 1px solid var(--line); font-size: 11px; }
.attract-strip .dot { color: #4a4841; }
.attract-strip .tail { margin-left: auto; letter-spacing: 0.06em; }
.attract-work { position: absolute; top: 108px; right: 15px; display: grid; gap: 9px; width: 190px; font-size: 10px; }
.attract-rail { position: absolute; top: 236px; right: 15px; display: grid; gap: 3px; width: 190px; font-size: 10px; }
.rail-head { display: flex; justify-content: space-between; padding-bottom: 4px; border-bottom: 1px solid #1c1b17; color: #413f39; letter-spacing: 0.07em; }
.rail-row { display: flex; justify-content: space-between; gap: 8px; }
.rail-row span:last-child { color: #343229; }
.work-row { display: grid; gap: 3px; }
.work-top { display: flex; justify-content: space-between; color: #413f39; }
.work-bar { height: 2px; background: #1c1b17; }
.work-fill { height: 100%; background: #3a382f; }

/* The menu itself sits in the middle band, at full strength. */
.title-body { display: grid; align-content: center; padding: 0 15px 0 56px; }

/* Settings and credits replace the menu column; this is a screen, not a modal. */



.credit-copy { display: grid; gap: 11px; margin: 0; color: var(--dim); font-size: 12px; line-height: 1.55; }
.credit-copy p { margin: 0; max-width: 56ch; }
.credit-copy em { color: var(--fg); font-style: normal; }
.credit-meta { display: grid; gap: 3px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--line-2); font-size: 10px; }
.credit-meta span b { color: var(--dim); font-weight: 400; }
</style>
</head>
<body>

<main class="title-screen">
  <div class="attract attract-top">
    <div class="attract-stock" id="attract-stock"></div>
    <span class="attract-run" id="attract-run"></span>
  </div>

  <div class="attract attract-strip">
    <span class="dot">●</span><span>CARAVAN</span>
    <span>9 lots · salt, oil, nails, cloth, glass, tools</span>
    <span class="tail">TRADE →</span>
  </div>

  <div class="attract attract-work" id="attract-work"></div>
  <div class="attract attract-rail">
    <span class="rail-head"><span>HOLDINGS</span><span>8 KINDS, 41</span></span>
    <span class="rail-row"><span>Charcoal ×14</span><span>trade stock</span></span>
    <span class="rail-row"><span>Planks ×8</span><span>trade stock</span></span>
    <span class="rail-row"><span>Baskets ×6</span><span>trade stock</span></span>
    <span class="rail-row"><span>Rope ×4</span><span>trade stock</span></span>
    <span class="rail-row"><span>Sandals ×2</span><span>forage costs less</span></span>
    <span class="rail-row"><span>Root cellar ×1</span><span>food keeps 2×</span></span>
    <span class="rail-row"><span>Leaf bed ×1</span><span>vigor ceiling +1</span></span>
    <span class="rail-row"><span>Garden bed ×1</span><span>grows food</span></span>
  </div>

  <div class="title-body" id="title-body"></div>

  <div class="attract attract-foot" id="attract-foot"></div>
</main>

<script>
/* ---------- the attract loop: the HUD, running ---------- */
const STOCKS = [
  { key: 'VI', value: 13, max: 15, drift: 0.05 },
  { key: 'PO', value: 7,  drift: 0.004 },
  { key: 'CO', value: 42, drift: 0.07 },
  { key: 'FO', value: 23, drift: 0.11 },
  { key: 'WA', value: 6,  drift: 0.05 },
  { key: 'FU', value: 4,  drift: 0.04 },
  { key: 'ME', value: 2,  drift: 0.02 },
  { key: 'MI', value: 9,  drift: 0.04 },
  { key: 'BI', value: 30, drift: 0.13 },
];

const WORK = [
  { name: 'Forage', at: 0.32, rate: 0.011 },
  { name: 'Garden bed', at: 0.68, rate: 0.004 },
  { name: 'Split wood', at: 0.11, rate: 0.008 },
];

/* Real lines in the game's own voice; the ground should not read as filler. */
const LOG = [
  'You return with 4 Biomass.',
  'Mira Halt took 6 Biomass at 4 coin.',
  'The garden bed is ready to collect.',
  'Tomas Dace is short on biomass and has Food to spare.',
  'A caravan is taking orders beside the east path.',
  'Seven people now share the settlement’s stores.',
  'You eat. Vigor climbs.',
  'A new recipe is within reach: Fishing net.',
  'Odd Ryne will not take charcoal — he has forty spare.',
  'The carpenter bench still lacks Biomass and Metal.',
  'Charcoal clears at 3 coin, down from 4.',
  'Split wood finishes. The hatchet holds.',
];

let day = 43, clock = 19 * 60 + 8, logIndex = 0;
const lines = [];

const stockEl = document.querySelector('#attract-stock');
const runEl = document.querySelector('#attract-run');
const workEl = document.querySelector('#attract-work');
const footEl = document.querySelector('#attract-foot');

const hhmm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(Math.floor(m) % 60).padStart(2, '0')}`;

function tick() {
  clock += 7;
  if (clock >= 24 * 60) { clock -= 24 * 60; day += 1; }

  STOCKS.forEach(s => {
    s.value = Math.max(0, s.value + (Math.random() - 0.42) * s.drift * 6);
    if (s.max) s.value = Math.min(s.max, s.value);
  });
  stockEl.innerHTML = STOCKS.map(s =>
    `<span>${s.key}: ${s.max ? `${s.value.toFixed(0)}/${s.max}` : s.value.toFixed(0)}</span>`).join('');
  runEl.textContent = `Act II · Day ${day}`;

  WORK.forEach(w => { w.at += w.rate; if (w.at >= 1) w.at = 0; });
  workEl.innerHTML = WORK.map(w => `<div class="work-row">
      <span class="work-top"><span>${w.name}</span><span>${Math.round(w.at * 100)}%</span></span>
      <span class="work-bar"><span class="work-fill" style="width:${w.at * 100}%"></span></span>
    </div>`).join('');
}

function pushLog() {
  lines.unshift({ t: hhmm(clock), m: LOG[logIndex % LOG.length] });
  logIndex += 1;
  if (lines.length > 3) lines.pop();
  footEl.innerHTML = lines.map(l =>
    `<span class="attract-line"><span class="t">${l.t}</span><span>${l.m}</span></span>`).join('');
}

/* ---------- settings, held only for this session ---------- */
const DIFFICULTIES = [
  { key: 'abundant',  name: 'ABUNDANT',  cost: 0.8,  yield: 1.25, note: 'The valley is generous. Mistakes are survivable.' },
  { key: 'temperate', name: 'TEMPERATE', cost: 1.0,  yield: 1.0,  note: 'The valley as it is.' },
  { key: 'harsh',     name: 'HARSH',     cost: 1.25, yield: 0.8,  note: 'Everything takes longer and gives less.' },
  { key: 'barren',    name: 'BARREN',    cost: 1.5,  yield: 0.65, note: 'You will not build everything. Choose.' },
];

const settings = { difficulty: 'temperate', music: 60, effects: 75, scale: '100', contrast: 'normal', window: '1600' };
let screen = 'menu';

const bodyEl = document.querySelector('#title-body');

function renderMenu() {
  bodyEl.innerHTML = `
    <h1 class="wordmark">Human Action</h1>
    <nav class="menu">
      <button class="menu-item" type="button" disabled>
        <span class="menu-mark">›</span>Continue
        <span class="menu-why">no settlement in progress</span>
      </button>
      <button class="menu-item" type="button" data-go="new"><span class="menu-mark">›</span>New game</button>
      <button class="menu-item" type="button" data-go="settings"><span class="menu-mark">›</span>Settings</button>
      <button class="menu-item" type="button" data-go="credits"><span class="menu-mark">›</span>Credits</button>
      <button class="menu-item" type="button" data-go="quit"><span class="menu-mark">›</span>Quit</button>
    </nav>`;
  bodyEl.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

function renderSettings() {
  const d = DIFFICULTIES.find(x => x.key === settings.difficulty);
  bodyEl.innerHTML = `
    <div class="panel-head">
      <h2 class="panel-title">Settings</h2>
      <button class="panel-back" type="button" data-go="menu">BACK</button>
    </div>
    <div class="panel-body">
      <div class="setting">
        <span class="setting-label">DIFFICULTY</span>
        <span class="setting-field">
          <span class="choices">${DIFFICULTIES.map(x =>
            `<button type="button" data-diff="${x.key}" aria-pressed="${x.key === settings.difficulty}">${x.name}</button>`).join('')}</span>
          <span class="setting-note">${d.note} Inputs cost <b>×${d.cost.toFixed(2)}</b>, yields return <b>×${d.yield.toFixed(2)}</b>.</span>
        </span>
      </div>

      <div class="setting">
        <span class="setting-label">MUSIC</span>
        <span class="setting-field"><span class="level">
          <input class="eating-slider" type="range" min="0" max="100" value="${settings.music}" data-level="music" aria-label="Music volume" style="--ration-position: ${settings.music}%">
          <output>${settings.music}%</output></span></span>
      </div>

      <div class="setting">
        <span class="setting-label">EFFECTS</span>
        <span class="setting-field"><span class="level">
          <input class="eating-slider" type="range" min="0" max="100" value="${settings.effects}" data-level="effects" aria-label="Effects volume" style="--ration-position: ${settings.effects}%">
          <output>${settings.effects}%</output></span></span>
      </div>

      <div class="setting">
        <span class="setting-label">UI SCALE</span>
        <span class="setting-field">
          <span class="choices">${['90', '100', '110', '125'].map(v =>
            `<button type="button" data-scale="${v}" aria-pressed="${v === settings.scale}">${v}%</button>`).join('')}</span>
          <span class="setting-note">The interface is dense and mostly small text.</span>
        </span>
      </div>

      <div class="setting">
        <span class="setting-label">CONTRAST</span>
        <span class="setting-field">
          <span class="choices">${[['normal', 'NORMAL'], ['high', 'HIGH']].map(([v, label]) =>
            `<button type="button" data-contrast="${v}" aria-pressed="${v === settings.contrast}">${label}</button>`).join('')}</span>
          <span class="setting-note">Raises the palette and separates the resource colours for red-green vision.</span>
        </span>
      </div>

      <div class="setting">
        <span class="setting-label">WINDOW</span>
        <span class="setting-field">
          <span class="choices">${[['1280', '1280×720'], ['1600', '1600×900'], ['1920', '1920×1080'], ['full', 'FULLSCREEN']].map(([v, label]) =>
            `<button type="button" data-window="${v}" aria-pressed="${v === settings.window}">${label}</button>`).join('')}</span>
          <span class="setting-note">The terminal centres in the window; a wider one shows more of the rail.</span>
        </span>
      </div>
    </div>`;

  bodyEl.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  bodyEl.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => { settings.difficulty = b.dataset.diff; renderSettings(); }));
  bodyEl.querySelectorAll('[data-scale]').forEach(b => b.addEventListener('click', () => { settings.scale = b.dataset.scale; renderSettings(); }));
  bodyEl.querySelectorAll('[data-contrast]').forEach(b => b.addEventListener('click', () => { settings.contrast = b.dataset.contrast; renderSettings(); }));
  bodyEl.querySelectorAll('[data-window]').forEach(b => b.addEventListener('click', () => { settings.window = b.dataset.window; renderSettings(); }));
  bodyEl.querySelectorAll('[data-level]').forEach(r => r.addEventListener('input', () => {
    settings[r.dataset.level] = Number(r.value);
    r.style.setProperty('--ration-position', `${r.value}%`);
    r.parentElement.querySelector('output').textContent = `${r.value}%`;
  }));
}

function renderCredits() {
  bodyEl.innerHTML = `
    <div class="panel-head">
      <h2 class="panel-title">Credits</h2>
      <button class="panel-back" type="button" data-go="menu">BACK</button>
    </div>
    <div class="panel-body">
      <div class="credit-copy">
        <p>A game about what people do when they cannot have everything.</p>
        <p>You begin alone, and every hour you spend is an hour you did not spend
           on something else. That is the whole difficulty. Later there are others,
           and you will find they are better than you at some things — <em>and that
           this turns out to be good news</em>.</p>
        <p>Named after a long book by Ludwig von Mises. You don't have to read it.</p>
      </div>
      <div class="credit-meta">
        <span><b>Design and code</b> · Caio Lacerda de Castro</span>
        <span><b>Built with</b> · Zig and SDL3, no engine</span>
        <span><b>Typeface</b> · JetBrains Mono</span>
      </div>
    </div>`;
  bodyEl.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

function go(where) {
  if (where === 'new' || where === 'quit') return; /* the shell owns these */
  screen = where;
  render();
}

function render() {
  if (screen === 'settings') renderSettings();
  else if (screen === 'credits') renderCredits();
  else renderMenu();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && screen !== 'menu') { screen = 'menu'; render(); }
});

const params = new URLSearchParams(location.search);
screen = params.get('screen') || 'menu';
render();
tick(); pushLog(); clock += 23; pushLog(); clock += 31; pushLog();
setInterval(tick, 160);
setInterval(pushLog, 3400);
</script>
</body>
</html>
